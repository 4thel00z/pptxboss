[package]
name = "pptxboss-core"
description = "PresentationML (.pptx) reader in pure Rust: ZIP container, OPC package, XML tokenizer and the document model (ECMA-376)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["pptx", "powerpoint", "ecma-376", "ooxml", "parser"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
thiserror = "2"
memchr = "2"

[dev-dependencies]
pptxboss-testkit = { path = "../pptxboss-testkit" }
criterion = { workspace = true }
# The reference inflate the in-tree decoder is tested against.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[[bench]]
name = "read"
harness = false
